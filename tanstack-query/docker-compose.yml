# Local Postgres 16 for Payment Integrity Reporting.
#   npm run db:up  /  npm run db:down
services:
  postgres:
    image: postgres:16-alpine
    container_name: pi-tanstack-postgres
    environment:
      POSTGRES_USER: pi
      POSTGRES_PASSWORD: pi
      POSTGRES_DB: pi
    ports:
      - "5432:5432"
    volumes:
      - pi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pi -d pi"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pi-pgdata:
