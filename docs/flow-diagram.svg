<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1826" viewBox="0 0 1600 1826" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#002677"/></marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0B7A3E"/></marker>
  </defs>
  <rect width="1600" height="1826" fill="#fff"/>
  <rect width="1600" height="6" fill="#FF612B"/>
  <text x="40" y="58" font-size="28" font-weight="700" fill="#002677">Payment Integrity Reporting · Savings Invoice data flow</text>
  <text x="40" y="90" font-size="15" fill="#4B4D4F">React page → JSON (dataset id + required fields) → Query API → BI_Engine stored procedure (JSON → SQL) → Postgres → JSON back to the page</text>
  
  <rect x="60" y="120" width="300" height="70" rx="12" fill="#002677"/>
  <text x="210" y="150" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">React app</text>
  <text x="210" y="174" font-size="13" fill="#DCE3F5" text-anchor="middle">Browser · LoginPage · SavingsInvoicePage</text>
  <line x1="210" y1="190" x2="210" y2="1766" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="4 6"/>
  <rect x="470" y="120" width="300" height="70" rx="12" fill="#002677"/>
  <text x="620" y="150" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Function API</text>
  <text x="620" y="174" font-size="13" fill="#DCE3F5" text-anchor="middle">Node 24 · server/routes.js</text>
  <line x1="620" y1="190" x2="620" y2="1766" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="4 6"/>
  <rect x="880" y="120" width="300" height="70" rx="12" fill="#002677"/>
  <text x="1030" y="150" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">BI_Engine stored procedure</text>
  <text x="1030" y="174" font-size="13" fill="#DCE3F5" text-anchor="middle">bi_engine.execute_query</text>
  <line x1="1030" y1="190" x2="1030" y2="1766" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="4 6"/>
  <rect x="1250" y="120" width="300" height="70" rx="12" fill="#002677"/>
  <text x="1400" y="150" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Postgres tables</text>
  <text x="1400" y="174" font-size="13" fill="#DCE3F5" text-anchor="middle">schema pi</text>
  <line x1="1400" y1="190" x2="1400" y2="1766" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="4 6"/>
  <rect x="24" y="230" width="1552" height="284" rx="10" fill="#F6F7F9" stroke="#E3E5E8"/>
  <text x="44" y="260" font-size="17" font-weight="700" fill="#002677">A · Sign in</text>
  <line x1="226" y1="312" x2="612" y2="312" stroke="#002677" stroke-width="2.2"  marker-end="url(#req)"/>
  <circle cx="210" cy="312" r="12" fill="#FF612B" stroke="#fff" stroke-width="2"/>
  <text x="210" y="316.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="415" y="302" font-size="14" font-weight="600" fill="#002677" text-anchor="middle">POST /api/auth/login</text>
  <text x="415" y="332" font-size="12.5" fill="#4B4D4F" text-anchor="middle">{ username, password }</text>
  <line x1="636" y1="378" x2="1392" y2="378" stroke="#002677" stroke-width="2.2"  marker-end="url(#req)"/>
  <circle cx="620" cy="378" r="12" fill="#FF612B" stroke="#fff" stroke-width="2"/>
  <text x="620" y="382.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="1010" y="368" font-size="14" font-weight="600" fill="#002677" text-anchor="middle">Verify scrypt password hash (pi.users)</text>
  <text x="1010" y="398" font-size="12.5" fill="#4B4D4F" text-anchor="middle">insert pi.user_session (sha256 of token, expires in 8 h)</text>
  <line x1="604" y1="444" x2="218" y2="444" stroke="#0B7A3E" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ret)"/>
  <circle cx="620" cy="444" r="12" fill="#FF612B" stroke="#fff" stroke-width="2"/>
  <text x="620" y="448.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="415" y="434" font-size="14" font-weight="600" fill="#0B7A3E" text-anchor="middle">200 { token, user }</text>
  <text x="415" y="464" font-size="12.5" fill="#4B4D4F" text-anchor="middle">token kept in sessionStorage → Authorization: Bearer</text>
  <rect x="24" y="540" width="1552" height="268" rx="10" fill="#FBF9F4" stroke="#E3E5E8"/>
  <text x="44" y="570" font-size="17" font-weight="700" fill="#002677">B · Open the report, load saved datasets</text>
  <line x1="226" y1="622" x2="612" y2="622" stroke="#002677" stroke-width="2.2"  marker-end="url(#req)"/>
  <circle cx="210" cy="622" r="12" fill="#FF612B" stroke="#fff" stroke-width="2"/>
  <text x="210" y="626.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="415" y="612" font-size="14" font-weight="600" fill="#002677" text-anchor="middle">GET /api/datasets</text>
  <text x="415" y="642" font-size="12.5" fill="#4B4D4F" text-anchor="middle">Bearer token → user (customer, user id)</text>
  <line x1="636" y1="688" x2="1392" y2="688" stroke="#002677" stroke-width="2.2"  marker-end="url(#req)"/>
  <circle cx="620" cy="688" r="12" fill="#FF612B" stroke="#fff" stroke-width="2"/>
  <text x="620" y="692.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="1010" y="678" font-size="14" font-weight="600" fill="#002677" text-anchor="middle">Own + public datasets of the customer</text>
  <text x="1010" y="708" font-size="12.5" fill="#4B4D4F" text-anchor="middle">pi.dataset + pi.dataset_filter</text>
  <line x1="604" y1="754" x2="218" y2="754" stroke="#0B7A3E" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ret)"/>
  <circle cx="620" cy="754" r="12" fill="#FF612B" stroke="#fff" stroke-width="2"/>
  <text x="620" y="758.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text>
  <text x="415" y="744" font-size="14" font-weight="600" fill="#0B7A3E" text-anchor="middle">datasets[ ] → "Saved dataset" picker</text>
  <rect x="24" y="834" width="1552" height="586" rx="10" fill="#F6F7F9" stroke="#E3E5E8"/>
  <text x="44" y="864" font-size="17" font-weight="700" fill="#002677">C · Run the report (saved dataset by id, or filters chosen by hand)</text>
  <line x1="226" y1="916" x2="612" y2="916" stroke="#002677" stroke-width="2.2"  marker-end="url(#req)"/>
  <circle cx="210" cy="916" r="12" fill="#FF612B" stroke="#fff" stroke-width="2"/>
  <text x="210" y="920.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">7</text>
  <text x="415" y="906" font-size="14" font-weight="600" fill="#002677" text-anchor="middle">POST /api/query</text>
  <text x="415" y="936" font-size="12.5" fill="#4B4D4F" text-anchor="middle">{ reportId, datasetId?, filters: [{ attributeKey, values[ ] }], measures, aggregates, months }</text>
  <line x1="636" y1="982" x2="1022" y2="982" stroke="#002677" stroke-width="2.2"  marker-end="url(#req)"/>
  <circle cx="620" cy="982" r="12" fill="#FF612B" stroke="#fff" stroke-width="2"/>
  <text x="620" y="986.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">8</text>
  <text x="825" y="972" font-size="14" font-weight="600" fill="#002677" text-anchor="middle">SELECT bi_engine.execute_query(…)</text>
  <text x="825" y="1002" font-size="12.5" fill="#4B4D4F" text-anchor="middle">(user_id, request::jsonb)</text>
  <rect x="840" y="1026" width="380" height="148" rx="8" fill="#FFF7E0" stroke="#F2B411" stroke-width="1.5"/>
  <circle cx="858" cy="1045" r="11" fill="#FF612B"/>
  <text x="858" y="1049.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">9</text>
  <text x="878" y="1050" font-size="13" fill="#4B4D4F" font-weight="700">Inside the stored procedure</text>
  <text x="878" y="1071" font-size="13" fill="#4B4D4F">• customer = the signed-in user’s customer</text>
  <text x="878" y="1092" font-size="13" fill="#4B4D4F">• validate measures / attributes / months</text>
  <text x="878" y="1113" font-size="13" fill="#4B4D4F">   against pi.kpi_measure, pi.query_attribute</text>
  <text x="878" y="1134" font-size="13" fill="#4B4D4F">• datasetId → load its filters (owner or public)</text>
  <text x="878" y="1155" font-size="13" fill="#4B4D4F">• build SQL: names via %I, values as $1 $2 $3</text>
  <line x1="1046" y1="1218" x2="1392" y2="1218" stroke="#002677" stroke-width="2.2"  marker-end="url(#req)"/>
  <circle cx="1030" cy="1218" r="12" fill="#FF612B" stroke="#fff" stroke-width="2"/>
  <text x="1030" y="1222.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">10</text>
  <text x="1215" y="1208" font-size="14" font-weight="600" fill="#002677" text-anchor="middle">EXECUTE … FROM pi.fact_savings</text>
  <text x="1215" y="1238" font-size="12.5" fill="#4B4D4F" text-anchor="middle">bound filters · last N months · GROUP BY month</text>
  <line x1="1014" y1="1284" x2="628" y2="1284" stroke="#0B7A3E" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ret)"/>
  <circle cx="1030" cy="1284" r="12" fill="#FF612B" stroke="#fff" stroke-width="2"/>
  <text x="1030" y="1288.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">11</text>
  <text x="825" y="1274" font-size="14" font-weight="600" fill="#0B7A3E" text-anchor="middle">jsonb result</text>
  <text x="825" y="1304" font-size="12.5" fill="#4B4D4F" text-anchor="middle">{ report, dataset, kpis, rows, filterOptions, appliedFilters }</text>
  <line x1="604" y1="1350" x2="218" y2="1350" stroke="#0B7A3E" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ret)"/>
  <circle cx="620" cy="1350" r="12" fill="#FF612B" stroke="#fff" stroke-width="2"/>
  <text x="620" y="1354.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">12</text>
  <text x="415" y="1340" font-size="14" font-weight="600" fill="#0B7A3E" text-anchor="middle">200 JSON → KPI tiles + month table</text>
  <text x="415" y="1370" font-size="12.5" fill="#4B4D4F" text-anchor="middle">400 + field on invalid input · 404 if dataset not visible</text>
  <rect x="24" y="1446" width="1552" height="284" rx="10" fill="#FBF9F4" stroke="#E3E5E8"/>
  <text x="44" y="1476" font-size="17" font-weight="700" fill="#002677">D · Save, update or delete a dataset</text>
  <line x1="226" y1="1528" x2="612" y2="1528" stroke="#002677" stroke-width="2.2"  marker-end="url(#req)"/>
  <circle cx="210" cy="1528" r="12" fill="#FF612B" stroke="#fff" stroke-width="2"/>
  <text x="210" y="1532.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">13</text>
  <text x="415" y="1518" font-size="14" font-weight="600" fill="#002677" text-anchor="middle">POST /api/datasets  ·  PUT / DELETE /:id</text>
  <text x="415" y="1548" font-size="12.5" fill="#4B4D4F" text-anchor="middle">{ name, description, filters } · only the owner may PUT / DELETE</text>
  <line x1="636" y1="1594" x2="1392" y2="1594" stroke="#002677" stroke-width="2.2"  marker-end="url(#req)"/>
  <circle cx="620" cy="1594" r="12" fill="#FF612B" stroke="#fff" stroke-width="2"/>
  <text x="620" y="1598.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">14</text>
  <text x="1010" y="1584" font-size="14" font-weight="600" fill="#002677" text-anchor="middle">Validate name + values exist; write rows</text>
  <text x="1010" y="1614" font-size="12.5" fill="#4B4D4F" text-anchor="middle">pi.dataset (readpolicy 1 = private) + pi.dataset_filter</text>
  <line x1="604" y1="1660" x2="218" y2="1660" stroke="#0B7A3E" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ret)"/>
  <circle cx="620" cy="1660" r="12" fill="#FF612B" stroke="#fff" stroke-width="2"/>
  <text x="620" y="1664.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">15</text>
  <text x="415" y="1650" font-size="14" font-weight="600" fill="#0B7A3E" text-anchor="middle">201 dataset → selected in picker</text>
  <text x="415" y="1680" font-size="12.5" fill="#4B4D4F" text-anchor="middle">409 if the user already has that name</text>
  <line x1="40" y1="1792" x2="90" y2="1792" stroke="#002677" stroke-width="2.2" marker-end="url(#req)"/>
  <text x="100" y="1797" font-size="13" fill="#4B4D4F">request</text>
  <line x1="180" y1="1792" x2="230" y2="1792" stroke="#0B7A3E" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ret)"/>
  <text x="240" y="1797" font-size="13" fill="#4B4D4F">response</text>
  <text x="340" y="1797" font-size="13" fill="#4B4D4F">Every call after sign-in carries Authorization: Bearer &lt;token&gt;. The customer is always taken from the signed-in user, never from the request.</text>
</svg>